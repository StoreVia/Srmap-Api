on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_PUBLIC_TURNSTILE_SITEKEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITEKEY }}

      - name: Prepare standalone output
        run: |
          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/

          if [ -d public ]; then
            cp -R public .next/standalone/public
          fi

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_5CC28AC1261B45EAAB383FE0D3F50886 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F61C0AFAF27E47498DA4E9A3D6B45C53 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4373A05D352346A0A1203495959510CE }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: srmapi
          slot-name: Production
          package: .next/standalone
          clean: true
          restart: true